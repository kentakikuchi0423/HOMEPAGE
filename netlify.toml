[build]
  command = "npm run build"
  publish = "out"

[functions]
  directory = "netlify/functions"

[dev]
  targetPort = 3000
  port = 8888

# 旧 URL（Netlify の初期アドレス）から独自ドメインへ恒久転送（301）。
# 検索エンジンの評価を新ドメインへ引き継ぐため、パスを保ったまま転送する
[[redirects]]
  from = "https://kentakikuchi.netlify.app/*"
  to = "https://kikuchi-kenta.jp/:splat"
  status = 301
  force = true

# セキュリティヘッダー（静的ファイルすべてに適用。Netlify Function の応答には適用されないため、
# Function 側（netlify/functions/go2senkyo-rss.ts）でも必要なヘッダーを個別に付けている）
[[headers]]
  for = "/*"
  [headers.values]
    # 他のサイトの枠（iframe）にこのサイトを埋め込ませない（クリックジャッキング対策。CSP の frame-ancestors と併用）
    X-Frame-Options = "DENY"
    # ファイルの種類をブラウザに推測させない
    X-Content-Type-Options = "nosniff"
    # 外部サイトへ移動するときに伝える参照元を、ドメイン名までに限る
    Referrer-Policy = "strict-origin-when-cross-origin"
    # このサイトでは使わないブラウザ機能を、埋め込んだ動画も含めて無効にする
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()"
    # このサイトが開いた別タブ・このサイトを開いた別タブとの間で、互いの画面を操作できないようにする
    Cross-Origin-Opener-Policy = "same-origin"
    # Content-Security-Policy（読み込みを許可する範囲の指定）:
    #   script-src:  静的書き出しでは Next.js がページ内にスクリプトを直接書き出すため 'unsafe-inline' が必要
    #   style-src:   Next.js がページ内に書き出すスタイルのため 'unsafe-inline' が必要
    #   img-src:     自サイト、YouTube のサムネイル、選挙ドットコムの投稿画像に限定
    #                （投稿画像のホストは src/content/site.ts の activity.rss.imageHosts と揃えること）
    #   font-src:    書体は next/font が自サイトから配信する
    #   connect-src: 通信先は自サイト（Netlify Function）のみ
    #   frame-src:   埋め込みは YouTube（Cookie を使わない youtube-nocookie）のみ
    #   frame-ancestors: 他のサイトからの埋め込みを禁止
    #   upgrade-insecure-requests: http の読み込みが混ざっても https に切り替える
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://go2senkyo-com-production-1.s3.ap-northeast-1.amazonaws.com https://*.go2senkyo.com https://go2senkyo.com; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# 検索結果に載せる必要のない内部ファイルに「登録しない」指定を付ける。
# 対象は、Next.js が書き出すページ遷移用のデータ（.txt）と、存在しないページ用の HTML。
# どちらも URL を直接開くと 200 で応答するため、検索エンジンがページとして拾うことがある
[[headers]]
  for = "/index.txt"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/__next.__PAGE__.txt"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/__next._full.txt"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/__next._tree.txt"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/_not-found/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/404/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"
